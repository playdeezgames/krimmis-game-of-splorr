<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<title>Krimmis</title>
	<style>
		html, body { margin: 0; height: 100%; background: #111; color: #888; font: 12px/1.4 monospace; }
		body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
		canvas { image-rendering: pixelated; background: #000; touch-action: none; display: block; }
		footer { margin-top: 8px; text-align: center; max-width: 90vw; }
		footer a { color: #aaa; }
	</style>
</head>
<body>
	<canvas id="screen" width="320" height="240"></canvas>
	<footer>
		Krimmis by TheGrumpyGameDev. Made with an AI agent (Claude Code) at the author's direction.
		<a href="https://thegrumpygamedev.itch.io/">itch.io</a> · <a href="https://playdeezgames.github.io/oeuvre-of-splorr/">more games</a>
	</footer>
	<script src="odin.js"></script>
	<script>
	(function () {
		"use strict";
		const screen = document.getElementById("screen");
		const ctx = screen.getContext("2d");
		const memory = new odin.WasmMemoryInterface();
		let ex = null;
		function fit() {
			let s = Math.min(window.innerWidth / 320, (window.innerHeight - 40) / 240);
			s = s >= 1 ? Math.floor(s) : Math.max(s, 0.5);
			screen.style.width = Math.round(320 * s) + "px";
			screen.style.height = Math.round(240 * s) + "px";
		}
		window.addEventListener("resize", fit);
		fit();
		function draw() {
			ctx.fillStyle = "#000";
			ctx.fillRect(0, 0, 320, 240);
			ctx.fillStyle = "#fff";
			ctx.font = "16px monospace";
			ctx.fillText("KRIMMIS", 120, 100);
			ctx.fillText("Day " + ex.platform_day() + " of 24", 112, 130);
		}
		screen.addEventListener("pointerdown", e => {
			e.preventDefault();
			if (ex && ex.platform_end_day()) draw();
		});
		function boot() {
			if (!memory.exports || !memory.exports.platform_day) { requestAnimationFrame(boot); return; }
			ex = memory.exports;
			draw();
		}
		odin.runWasm("game.wasm", null, {}, memory);
		boot();
	})();
	</script>
</body>
</html>
